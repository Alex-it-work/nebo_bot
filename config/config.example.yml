# Скопируйте этот файл в config/config.yml и укажите свои данные.
# config/config.yml в .gitignore и в репозиторий не попадает.

# Учетные данные
username: "Имя в игре"
password: "ваш пароль"

# Настройки подключения
base_url: "https://nebo.mobi"
timeout: 30

# Паузы между действиями, в секундах.
# Это не жёсткие границы, а примерно 10-й и 90-й процентили: паузы берутся из
# логнормального распределения, поэтому изредка попадаются заметно длиннее.
delay_min: 1.5
delay_max: 3.5

# Пауза на "чтение" загруженной страницы, в секундах
page_load_min: 0.3
page_load_max: 1.2

# Изредка бот "отвлекается" — это главное, что отличает его от метронома.
long_pause_chance: 0.04 # доля действий с длинным перерывом (0 — выключить)
long_pause_min: 20
long_pause_max: 120

# Сколько минут играть за один запуск. 0 — без ограничения, но бот, который
# играет сутками без пауз, заметен именно этим, а не скоростью кликов.
session_max_minutes: 0

# Часы, в которые разрешено играть, например "09:00-23:30".
# Можно указать окно через полночь: "22:00-02:00". Пусто — без ограничений.
active_hours: ""

# Лабиринт
maze_target_level: 10
maze_max_attempts: 0 # 0 — без ограничения

# Накопленная статистика по дверям. Чем дольше бот играет, тем лучше выбирает.
# Оставьте пустым, чтобы не сохранять между запусками.
maze_memory_file: "data/maze_memory.json"

# Логирование
log_level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: "logs/nebo_bot.log" # оставьте пустым, чтобы писать только в консоль
