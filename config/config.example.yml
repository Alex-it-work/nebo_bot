# Скопируйте этот файл в config/config.yml и укажите свои данные.
# config/config.yml в .gitignore и в репозиторий не попадает.

# --- Один профиль ---------------------------------------------------------
# Учетные данные
username: "Имя в игре"
password: "ваш пароль"

# --- Несколько профилей ---------------------------------------------------
# Вместо username/password выше можно перечислить аккаунты списком. Всё, что
# указано в defaults, действует на всех; в самом аккаунте это переопределяется.
# Запуск: python main.py — все по очереди, python main.py -a "Имя" — только один.
#
# defaults:
#   delay_min: 1.5
#   delay_max: 3.5
#   active_hours: "09:00-23:30"
#   maze_rounds: 1
#
# accounts:
#   - username: "Первый"
#     password: "пароль1"
#     maze_rounds: 3      # этому — три лабиринта
#   - username: "Второй"
#     password: "пароль2" # этому — один, как в defaults

# Настройки подключения
base_url: "https://nebo.mobi"
timeout: 30

# Паузы между действиями, в секундах.
# Это не жёсткие границы, а примерно 10-й и 90-й процентили: паузы берутся из
# логнормального распределения, поэтому изредка попадаются заметно длиннее.
delay_min: 1.5
delay_max: 3.5

# Пауза на "чтение" загруженной страницы, в секундах
page_load_min: 0.3
page_load_max: 1.2

# Изредка бот "отвлекается" — это главное, что отличает его от метронома.
long_pause_chance: 0.04 # доля действий с длинным перерывом (0 — выключить)
long_pause_min: 20
long_pause_max: 120

# Сколько минут играть за один запуск. 0 — без ограничения, но бот, который
# играет сутками без пауз, заметен именно этим, а не скоростью кликов.
session_max_minutes: 0

# Часы, в которые разрешено играть, например "09:00-23:30".
# Можно указать окно через полночь: "22:00-02:00". Пусто — без ограничений.
active_hours: ""

# Тратить ли игровые баксы на ускорения (развезти всех, выселить пачкой).
# На крупном профиле выгодно, на мелком — нет: дневной доход баксов низкий.
spend_baksy: false

# Скрывать объявления города на странице лифта
hide_city_announcements: true

# Сохранять последние N страниц игры, чтобы открыть их в браузере и увидеть
# то же, что видел бот. 0 — не сохранять. Папка работает как кольцо: старые
# страницы удаляются, размер не растёт.
record_pages: 0
record_dir: "pages"

# Смотреть, как бот играет, прямо в браузере: http://127.0.0.1:8765/
# Страница обновляется в момент, когда бот получил новую, без опроса по таймеру.
live_view: false
live_port: 8765

# Как часто заглядывать на посторонние страницы между делами: чат, рейтинг,
# форум, свой профиль. Ничего не стоит, кроме запроса, зато бот перестаёт
# ходить только по нужным адресам в одном и том же порядке. 0 — выключить.
wander_chance: 0.12

# Лабиринт
# Покупать гарантированный проход, который игра предлагает на экране тупика
# ("Пройти за 200" — цена в КЛЮЧАХ). По замерам игра обходится в ~131 ключ на
# приз, покупка — 200: дороже на треть, зато мгновенно и без невезения.
buy_finish: false
maze_target_level: 10
maze_max_attempts: 0 # 0 — без ограничения

# Логирование
log_level: "INFO" # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: "logs/nebo_bot.log" # оставьте пустым, чтобы писать только в консоль
